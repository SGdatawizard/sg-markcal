20px)!important;min-width:var(--hover-width,320px)}.task.is-dragging{opacity:.9;cursor:grabbing;z-index:999;transition:none!important;pointer-events:none;box-shadow:0 18px 42px rgba(20,24,38,.22)}.task.selected{outline:4px solid #e8ebf5}.task::before{content:&quot;&quot;;position:absolute;left:0;top:0;width:6px;height:100%;background:var(--task-colour,#94a3b8);border-radius:12px 0 0 12px;opacity:.9;z-index:1;pointer-events:none}.task-content{position:relative;z-index:5;width:100%;min-width:0}.task-title{font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}.task-meta{color:var(--muted);font-size:11px;line-height:1.15;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-icon{position:absolute;right:10px;bottom:8px;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;font-size:12px;background:var(--soft);z-index:6}.resize-handle{position:absolute;top:0;width:14px;height:100%;cursor:ew-resize;z-index:7}.resize-left{left:0}.resize-right{right:0}.resize-handle:hover{background:rgba(15,23,42,.08)}.short-activity .task-content{display:none}.short-activity::after{content:attr(data-label);position:absolute;left:22px;right:36px;top:22px;z-index:5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;color:inherit}.short-activity:hover .task-content{display:block}.short-activity:hover::after{display:none}.drawer{width:390px;flex:0 0 390px;background:#fff;border-left:1px solid var(--line);padding:24px;overflow:auto}.drawer.hidden{display:none}.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:900;color:#7b8497;text-transform:uppercase;margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{background:#f7f8fb;border-radius:18px;padding:14px;color:#60697d;line-height:1.45;margin-top:16px}

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;&lt;aside class=&quot;sidebar&quot;&gt;&lt;div class=&quot;logo&quot;&gt;&lt;div class=&quot;logo-mark&quot;&gt;M&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Marketing planner&lt;/p&gt;&lt;h1&gt;Campaign Flow&lt;/h1&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;section-title&quot;&gt;Your channels&lt;/div&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;toggleAddChannel&quot; style=&quot;width:100%;margin-bottom:10px&quot;&gt;+ Add channel&lt;/button&gt;&lt;div class=&quot;form-grid&quot; id=&quot;addChannelPane&quot; hidden&gt;&lt;input id=&quot;newChannelName&quot; placeholder=&quot;e.g. SEO, PR, Events&quot; /&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;addChannelButton&quot;&gt;Save channel&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;showAllChannels&quot; style=&quot;width:100%;margin:6px 0 12px&quot;&gt;Show all channels&lt;/button&gt;&lt;div class=&quot;row-list&quot; id=&quot;channelNav&quot;&gt;&lt;/div&gt;&lt;div class=&quot;team-card&quot;&gt;&lt;strong&gt;Team members&lt;/strong&gt;&lt;div class=&quot;form-grid&quot; style=&quot;margin-top:12px&quot;&gt;&lt;input id=&quot;newOwnerName&quot; placeholder=&quot;e.g. Sarah&quot; /&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;addOwnerButton&quot;&gt;+ Add team member&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;row-list&quot; id=&quot;teamLoad&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;main class=&quot;main&quot;&gt;&lt;header class=&quot;topbar&quot;&gt;&lt;div class=&quot;topbar-inner&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Drag activities across dates and channels&lt;/p&gt;&lt;h2&gt;Marketing calendar&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;toolbar&quot;&gt;&lt;input class=&quot;search&quot; id=&quot;search&quot; placeholder=&quot;Search activities or owners&quot; /&gt;&lt;select id=&quot;categoryFilter&quot; style=&quot;width:170px&quot;&gt;&lt;option value=&quot;all&quot;&gt;All categories&lt;/option&gt;&lt;/select&gt;&lt;select id=&quot;tierFilter&quot; style=&quot;width:120px&quot;&gt;&lt;option value=&quot;all&quot;&gt;All tiers&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;undoButton&quot;&gt;Undo&lt;/button&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;prev&quot;&gt;← Week&lt;/button&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;today&quot;&gt;Today&lt;/button&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;next&quot;&gt;Week →&lt;/button&gt;&lt;button class=&quot;btn btn-secondary&quot; id=&quot;toggleDrawer&quot;&gt;Hide edit panel&lt;/button&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;addActivity&quot;&gt;+ Add activity&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;workspace&quot;&gt;&lt;div class=&quot;timeline-wrap&quot;&gt;&lt;div class=&quot;timeline&quot; id=&quot;timeline&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;drawer&quot; id=&quot;drawer&quot;&gt;&lt;/aside&gt;&lt;/section&gt;&lt;/main&gt;&lt;/div&gt;
&lt;script&gt;
const DAY_MS=86400000, VIEW_DAYS=180, DAY_WIDTH=62;
const CHANNEL_COLOURS=['#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#6366f1','#14b8a6','#84cc16','#6b7280'];
const ACTIVITY_CATEGORIES=['Uncategorised','Stamps','Coins','Bullion','Militaria','Trading Cards','Comics'];
const ACTIVITY_TIERS=['Tier 1','Tier 2','Tier 3'];
const STATUS_OPTIONS=['Planned','In progress','Blocked','Done'];
let viewStart=addDays(startOfWeek(new Date()),-30), filter='all', categoryFilter='all', tierFilter='all', selectedId=1, drawerOpen=false, dragState=null, draftActivity=null, editingChannelId=null, editingOwnerIndex=null, openPaletteId=null, addChannelOpen=false, scrollExtendLock=false, suppressLaneCreate=false, scrollInitialised=false, undoStack=[];
let channels=load('marketingPlannerChannels',[{id:'channel1',name:'SEO',color:'#7c3aed'},{id:'channel2',name:'PR',color:'#0ea5e9'},{id:'channel3',name:'Events',color:'#10b981'}]);
let owners=load('marketingPlannerOwners',['Pierre','Maya','Alex','Sam']);
let campaigns=ensureUniqueActivityIds(load('marketingPlannerCampaigns',[{id:1,title:'Example campaign',channel:channels[0].id,owner:owners[0]||'Pierre',status:'Planned',priority:'Tier 1',category:'Uncategorised',start:fmt(addDays(new Date(),1)),end:fmt(addDays(new Date(),8)),notes:'Drag this block to a different date or channel.',attachments:[]},{id:2,title:'Example content sprint',channel:channels[1]?.id||channels[0].id,owner:owners[1]||owners[0],status:'In progress',priority:'Tier 2',category:'Coins',start:fmt(addDays(new Date(),5)),end:fmt(addDays(new Date(),18)),notes:'Add your own channels, team members and activities.',attachments:[]}]));
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
function ensureUniqueActivityIds(items){const seen=new Set();return(items||[]).map((item,i)=&gt;{let id=item.id;if(!id||seen.has(id)){id=Date.now()+i+Math.floor(Math.random()*100000)}seen.add(id);return{...item,id}})}
function snapshot(){undoStack.push(JSON.stringify({channels,owners,campaigns,filter,selectedId}));if(undoStack.length&gt;30)undoStack.shift()}
function saveAll(){campaigns=ensureUniqueActivityIds(campaigns);localStorage.setItem('marketingPlannerChannels',JSON.stringify(channels));localStorage.setItem('marketingPlannerOwners',JSON.stringify(owners));localStorage.setItem('marketingPlannerCampaigns',JSON.stringify(campaigns))}
function undoLast(){const last=undoStack.pop();if(!last){alert('Nothing to undo yet.');return}const s=JSON.parse(last);channels=s.channels;owners=s.owners;campaigns=s.campaigns;filter=s.filter||'all';selectedId=s.selectedId;draftActivity=null;saveAll();render()}
function esc(v){return String(v??'').replace(/[&amp;&lt;&gt;&quot;]/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;'}[c]))}
function date(v){if(v instanceof Date)return v;const[y,m,d]=String(v).split('-').map(Number);return new Date(y,m-1,d)}
function fmt(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));x.setHours(0,0,0,0);return x}
function daysBetween(s,e){return Math.round((date(e)-date(s))/DAY_MS)+1}
function getChannel(id){return channels.find(c=&gt;c.id===id)||channels[0]}
function categoryIcon(v){return({'Uncategorised':'📦','Stamps':'📮','Coins':'🪙','Bullion':'🥇','Militaria':'🎖️','Trading Cards':'🃏','Comics':'📚'})[v]||'📦'}
function statusIcon(s){return({'Planned':'🗓️','In progress':'🚀','Blocked':'🚫','Done':'✅'})[s]||'📌'}
function getVisibleCampaigns(){const q=(document.getElementById('search')?.value||'').toLowerCase();return campaigns.filter(i=&gt;(filter==='all'||i.channel===filter)&amp;&amp;(categoryFilter==='all'||(i.category||'Uncategorised')===categoryFilter)&amp;&amp;(tierFilter==='all'||(i.priority||'Tier 1')===tierFilter)&amp;&amp;(String(i.title).toLowerCase().includes(q)||String(i.owner).toLowerCase().includes(q)))}
function addChannel(){const input=document.getElementById('newChannelName');const name=input.value.trim();if(!name){input.focus();return}snapshot();const c={id:'channel_'+Date.now(),name,color:CHANNEL_COLOURS[channels.length%CHANNEL_COLOURS.length]};channels.push(c);filter=c.id;input.value='';addChannelOpen=false;saveAll();render()}
function setFilter(v){filter=v;render()}
function startEditChannel(id){editingChannelId=id;render()}function cancelEditChannel(){editingChannelId=null;render()}function renameChannel(id,name){const clean=String(name||'').trim();if(!clean)return;snapshot();getChannel(id).name=clean;editingChannelId=null;saveAll();render()}
function togglePalette(id){openPaletteId=openPaletteId===id?null:id;render()}function changeChannelColor(id,color){snapshot();getChannel(id).color=color;openPaletteId=null;saveAll();render()}
function deleteChannel(id){if(channels.length&lt;=1){alert('You need at least one channel.');return}snapshot();const fallback=channels.find(c=&gt;c.id!==id).id;channels=channels.filter(c=&gt;c.id!==id);campaigns=campaigns.map(c=&gt;c.channel===id?{...c,channel:fallback}:c);if(filter===id)filter='all';saveAll();render()}
function moveChannel(id,dir){const i=channels.findIndex(c=&gt;c.id===id),j=i+dir;if(i&lt;0||j&lt;0||j&gt;=channels.length)return;snapshot();const copy=[...channels];const[item]=copy.splice(i,1);copy.splice(j,0,item);channels=copy;saveAll();render()}
function addOwner(){const input=document.getElementById('newOwnerName');const name=input.value.trim();if(!name){input.focus();return}if(owners.some(o=&gt;o.toLowerCase()===name.toLowerCase())){alert('That team member already exists.');return}snapshot();owners.push(name);input.value='';saveAll();render()}
function startEditOwner(i){editingOwnerIndex=i;render()}function cancelEditOwner(){editingOwnerIndex=null;render()}function renameOwner(i,name){const clean=String(name||'').trim();if(!clean)return;snapshot();const old=owners[i];owners[i]=clean;editingOwnerIndex=null;campaigns=campaigns.map(c=&gt;c.owner===old?{...c,owner:clean}:c);saveAll();render()}
function deleteOwner(i){if(owners.length&lt;=1){alert('You need at least one team member.');return}snapshot();const old=owners[i],fallback=owners.find((_,idx)=&gt;idx!==i);owners=owners.filter((_,idx)=&gt;idx!==i);campaigns=campaigns.map(c=&gt;c.owner===old?{...c,owner:fallback}:c);saveAll();render()}
function renderNav(){const pane=document.getElementById('addChannelPane'),toggle=document.getElementById('toggleAddChannel');pane.hidden=!addChannelOpen;toggle.textContent=addChannelOpen?'Cancel add channel':'+ Add channel';document.getElementById('channelNav').innerHTML=channels.map(ch=&gt;`&lt;div class=&quot;channel-row&quot;&gt;${editingChannelId===ch.id?`&lt;input id=&quot;edit_channel_${ch.id}&quot; value=&quot;${esc(ch.name)}&quot;/&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:6px&quot;&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;renameChannel('${ch.id}',document.getElementById('edit_channel_${ch.id}').value)&quot;&gt;Save&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;cancelEditChannel()&quot;&gt;Cancel&lt;/button&gt;&lt;/div&gt;`:`&lt;button class=&quot;item-main ${filter===ch.id?'active':''}&quot; data-filter=&quot;${ch.id}&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:${ch.color}&quot;&gt;&lt;/span&gt;&lt;span&gt;${esc(ch.name)}&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;channel-actions&quot;&gt;&lt;div class=&quot;colour-wrap&quot;&gt;&lt;span class=&quot;colour-trigger&quot; style=&quot;background:${ch.color}&quot; onclick=&quot;togglePalette('${ch.id}')&quot;&gt;&lt;/span&gt;&lt;div class=&quot;palette ${openPaletteId===ch.id?'open':''}&quot;&gt;${CHANNEL_COLOURS.map(col=&gt;`&lt;span class=&quot;swatch&quot; style=&quot;background:${col}&quot; data-channel-color=&quot;${ch.id}&quot; data-colour-value=&quot;${col}&quot;&gt;&lt;/span&gt;`).join('')}&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;moveChannel('${ch.id}',-1)&quot;&gt;↑&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;moveChannel('${ch.id}',1)&quot;&gt;↓&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;startEditChannel('${ch.id}')&quot;&gt;Edit&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;deleteChannel('${ch.id}')&quot;&gt;Remove&lt;/button&gt;&lt;/div&gt;`}&lt;/div&gt;`).join('');document.getElementById('showAllChannels').className=filter==='all'?'btn btn-primary':'btn btn-secondary'}
function renderTeam(){document.getElementById('teamLoad').innerHTML=owners.map((owner,i)=&gt;{const count=campaigns.filter(c=&gt;c.owner===owner).length;return`&lt;div class=&quot;member-row&quot;&gt;${editingOwnerIndex===i?`&lt;div style=&quot;grid-column:1/-1&quot;&gt;&lt;input id=&quot;edit_owner_${i}&quot; value=&quot;${esc(owner)}&quot;/&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px&quot;&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;renameOwner(${i},document.getElementById('edit_owner_${i}').value)&quot;&gt;Save&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;cancelEditOwner()&quot;&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:`&lt;div&gt;&lt;strong&gt;${esc(owner)}&lt;/strong&gt;&lt;div class=&quot;member-load&quot;&gt;${count} activities&lt;/div&gt;&lt;div class=&quot;bar-bg&quot;&gt;&lt;div class=&quot;bar&quot; style=&quot;width:${Math.min(100,count*24)}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;startEditOwner(${i})&quot;&gt;Edit&lt;/button&gt;&lt;button class=&quot;btn-mini&quot; onclick=&quot;deleteOwner(${i})&quot;&gt;Remove&lt;/button&gt;`}&lt;/div&gt;`}).join('')}
function renderFilters(){const cat=document.getElementById('categoryFilter'),tier=document.getElementById('tierFilter');cat.innerHTML='&lt;option value=&quot;all&quot;&gt;All categories&lt;/option&gt;'+ACTIVITY_CATEGORIES.map(c=&gt;`&lt;option value=&quot;${c}&quot; ${categoryFilter===c?'selected':''}&gt;${categoryIcon(c)} ${c}&lt;/option&gt;`).join('');tier.innerHTML='&lt;option value=&quot;all&quot;&gt;All tiers&lt;/option&gt;'+ACTIVITY_TIERS.map(t=&gt;`&lt;option value=&quot;${t}&quot; ${tierFilter===t?'selected':''}&gt;${t}&lt;/option&gt;`).join('')}
function layoutItems(items){const lanes=[];return items.slice().sort((a,b)=&gt;date(a.start)-date(b.start)).map(item=&gt;{const s=date(item.start),e=date(item.end);let row=lanes.findIndex(last=&gt;s&gt;last);if(row===-1){row=lanes.length;lanes.push(e)}else lanes[row]=e;return{...item,layoutRow:row}})}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing Calendar Planner</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #f6f7fb;
        --panel: #fff;
        --ink: #172033;
        --muted: #70798b;
        --line: #e4e7ee;
        --soft: #f0f2f7;
        --dark: #151927;
        --danger-bg: #fff1f2;
        --danger: #be123c;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        width: 300px;
        flex: 0 0 300px;
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 22px;
        overflow: auto;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .logo-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--dark);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 900;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }
      h1 {
        font-size: 20px;
        margin: 2px 0 0;
      }
      h2 {
        font-size: 28px;
        margin: 0;
      }
      h3 {
        margin: 0;
      }
      .section-title {
        font-size: 12px;
        font-weight: 900;
        color: #8c93a3;
        text-transform: uppercase;
        margin: 20px 0 10px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #dfe3ec;
        border-radius: 13px;
        padding: 10px 12px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        box-shadow: 0 0 0 4px #e8ebf5;
      }
      .btn {
        border: 0;
        border-radius: 13px;
        padding: 10px 12px;
        font-weight: 850;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-primary {
        background: var(--dark);
        color: #fff;
      }
      .btn-secondary {
        background: var(--soft);
        color: #202638;
      }
      .btn-danger {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .btn-mini {
        border: 0;
        border-radius: 10px;
        background: var(--soft);
        padding: 8px;
        font-size: 11px;
        font-weight: 900;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .row-list {
        display: grid;
        gap: 7px;
      }
      .channel-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 8px;
        border-radius: 14px;
        background: #fafbfe;
        border: 1px solid #eef1f7;
      }
      .channel-actions {
        display: grid;
        grid-template-columns: 34px 36px 36px 44px 64px;
        gap: 6px;
        align-items: center;
      }
      .member-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 52px 72px;
        gap: 6px;
        align-items: center;
      }
      .item-main {
        min-width: 0;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px;
        border-radius: 13px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      .item-main:hover,
      .item-main.active {
        background: var(--soft);
      }
      .item-main span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
        flex: 0 0 auto;
      }
      .colour-wrap {
        position: relative;
      }
      .colour-trigger {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #d8dce6;
        display: block;
        cursor: pointer;
      }
      .palette {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        position: absolute;
        z-index: 90;
        margin-top: 6px;
        width: 160px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }
      .palette.open {
        display: flex;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px #d8dce6;
        cursor: pointer;
      }
      .team-card {
        margin-top: 24px;
        padding: 16px;
        background: #f7f8fb;
        border-radius: 20px;
      }
      .member-load {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .bar-bg {
        height: 7px;
        background: #e5e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 5px;
      }
      .bar {
        height: 100%;
        background: var(--dark);
        border-radius: 999px;
      }
      .main {
        flex: 1;
        min-width: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        flex: 0 0 auto;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--line);
        padding: 20px 24px;
        z-index: 5;
      }
      .topbar-inner {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .search {
        width: 230px;
      }
      .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: hidden;
      }
      .timeline-wrap {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 0 24px 24px 0;
        position: relative;
      }
      .timeline {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 0 26px 26px 0;
        overflow: visible;
        box-shadow: 0 12px 35px rgba(20, 24, 38, 0.06);
      }
      .grid-header,
      .lane {
        display: grid;
        grid-template-columns: var(--timeline-columns);
      }
      .grid-header {
        background: #f7f8fb;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 120;
      }
      .corner,
      .day {
        padding: 10px 8px;
        border-right: 1px solid var(--line);
        font-size: 12px;
        white-space: nowrap;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .corner {
        font-weight: 900;
        color: #667085;
        position: sticky;
        left: 0;
        z-index: 140;
        background: #f7f8fb;
        box-shadow: 1px 0 0 var(--line);
      }
      .date-inline {
        display: block;
        line-height: 1.2;
      }
      .date-inline strong {
        display: inline;
        color: #344054;
        margin-right: 4px;
      }
      .month-tag {
        display: block;
        font-size: 10px;
        color: #98a2b3;
        font-weight: 800;
        margin-bottom: 2px;
        min-height: 12px;
      }
      .weekend {
        background: #f1f3f7;
        color: #9aa2b4;
      }
      .today {
        background: #ede9fe !important;
        color: #5b21b6 !important;
      }
      .today .month-tag,
      .today strong {
        color: #5b21b6 !important;
      }
      .lane {
        min-height: 110px;
        border-bottom: 1px solid var(--line);
        position: relative;
      }
      .lane-label {
        position: sticky;
        left: 0;
        z-index: 50;
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 18px;
        font-weight: 900;
        box-shadow: 1px 0 0 var(--line);
        min-width: 220px;
      }
      .lane-label small {
        display: block;
        margin-top: 4px;
        color: #818898;
        font-weight: 650;
      }
      .lane-grid {
        grid-column: 2/-1;
        position: relative;
        min-height: 110px;
        background-image: repeating-linear-gradient(
          to right,
          transparent 0,
          transparent 61px,
          var(--line) 61px,
          var(--line) 62px
        );
      }
      .weekend-cell {
        position: absolute;
        top: 0;
        height: 100%;
        width: 62px;
        background: #f8fafc;
        pointer-events: none;
        z-index: 0;
      }
      .today-cell {
        position: absolute;
        top: 0;
        height: 100%;
        width: 62px;
        background: #f5f3ff;
        pointer-events: none;
        z-index: 0;
      }
      .task {
        position: absolute;
        z-index: 2;
        min-width: 0;
        height: 62px;
        background: #fff;
        border: 1px solid #e1e5ef;
        border-radius: 12px;
        padding: 10px 36px 10px 22px;
        box-shadow: 0 8px 24px rgba(20, 24, 38, 0.1);
        cursor: grab;
        transition:
          box-shadow 0.24s ease,
          transform 0.24s ease,
          width 0.24s ease;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .task:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(20, 24, 38, 0.14);
        z-index: 20;
      }
      .task.short-activity:hover,
      .task.expandable:hover {
        width: var(--hover-width, 320px) !important;
        min-width: var(--hover-width, 320px);
      }
      .task.is-dragging {
        opacity: 0.9;
        cursor: grabbing;
      }
      .task.selected {
        outline: 4px solid #e8ebf5;
      }
      .task::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 100%;
        background: var(--task-colour, #94a3b8);
        border-radius: 12px 0 0 12px;
        opacity: 0.9;
        z-index: 1;
        pointer-events: none;
      }
      .task-content {
        position: relative;
        z-index: 5;
        width: 100%;
        min-width: 0;
      }
      .task-title {
        font-weight: 900;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: inherit;
      }
      .task-meta {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.15;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status-icon {
        position: absolute;
        right: 10px;
        bottom: 8px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 12px;
        background: var(--soft);
        z-index: 6;
      }
      .resize-handle {
        position: absolute;
        top: 0;
        width: 14px;
        height: 100%;
        cursor: ew-resize;
        z-index: 7;
      }
      .resize-left {
        left: 0;
      }
      .resize-right {
        right: 0;
      }
      .resize-handle:hover {
        background: rgba(15, 23, 42, 0.08);
      }
      .short-activity .task-content {
        display: none;
      }
      .short-activity::after {
        content: attr(data-label);
        position: absolute;
        left: 22px;
        right: 36px;
        top: 22px;
        z-index: 5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 900;
        color: inherit;
      }
      .short-activity:hover .task-content {
        display: block;
      }
      .short-activity:hover::after {
        display: none;
      }
      .drawer {
        width: 390px;
        flex: 0 0 390px;
        background: #fff;
        border-left: 1px solid var(--line);
        padding: 24px;
        overflow: auto;
      }
      .drawer.hidden {
        display: none;
      }
      .drawer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 900;
        color: #7b8497;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .hint {
        background: #f7f8fb;
        border-radius: 18px;
        padding: 14px;
        color: #60697d;
        line-height: 1.45;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-mark">M</div>
          <div>
            <p class="eyebrow">Marketing planner</p>
            <h1>Campaign Flow</h1>
          </div>
        </div>
        <div class="section-title">Your channels</div>
        <button
          class="btn btn-secondary"
          id="toggleAddChannel"
          style="width: 100%; margin-bottom: 10px"
        >
          + Add channel
        </button>
        <div class="form-grid" id="addChannelPane" hidden>
          <input
            id="newChannelName"
            placeholder="e.g. SEO, PR, Events"
          /><button class="btn btn-primary" id="addChannelButton">
            Save channel
          </button>
        </div>
        <button
          class="btn btn-secondary"
          id="showAllChannels"
          style="width: 100%; margin: 6px 0 12px"
        >
          Show all channels
        </button>
        <div class="row-list" id="channelNav"></div>
        <div class="team-card">
          <strong>Team members</strong>
          <div class="form-grid" style="margin-top: 12px">
            <input id="newOwnerName" placeholder="e.g. Sarah" /><button
              class="btn btn-primary"
              id="addOwnerButton"
            >
              + Add team member
            </button>
          </div>
          <div class="row-list" id="teamLoad"></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-inner">
            <div>
              <p class="eyebrow">Drag activities across dates and channels</p>
              <h2>Marketing calendar</h2>
            </div>
            <div class="toolbar">
              <input
                class="search"
                id="search"
                placeholder="Search activities or owners"
              /><select id="categoryFilter" style="width: 170px">
                <option value="all">All categories</option></select
              ><select id="tierFilter" style="width: 120px">
                <option value="all">All tiers</option></select
              ><button class="btn btn-secondary" id="undoButton">Undo</button
              ><button class="btn btn-secondary" id="prev">← Week</button
              ><button class="btn btn-secondary" id="today">Today</button
              ><button class="btn btn-secondary" id="next">Week →</button
              ><button class="btn btn-secondary" id="toggleDrawer">
                Hide edit panel</button
              ><button class="btn btn-primary" id="addActivity">
                + Add activity
              </button>
            </div>
          </div>
        </header>
        <section class="workspace">
          <div class="timeline-wrap">
            <div class="timeline" id="timeline"></div>
          </div>
          <aside class="drawer" id="drawer"></aside>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // ── Supabase config ──────────────────────────────────────────────────────
      const SUPABASE_URL = "https://zrbtnqgwsayrmptpqsbk.supabase.co";
      const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyYnRucWd3c2F5cm1wdHBxc2JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDQ5NzcsImV4cCI6MjA5MzcyMDk3N30.WmgyG1TSFsnalhyP-Vp_2TMIqv1PeC1ixogUd-WyS1A";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      // ── Constants ────────────────────────────────────────────────────────────
      const DAY_MS = 86400000,
        VIEW_DAYS = 180,
        DAY_WIDTH = 62;
      const CHANNEL_COLOURS = [
        "#7c3aed","#0ea5e9","#10b981","#f59e0b","#ef4444",
        "#ec4899","#6366f1","#14b8a6","#84cc16","#6b7280",
      ];
      const ACTIVITY_CATEGORIES = [
        "Uncategorised","Stamps","Coins","Bullion",
        "Militaria","Trading Cards","Comics",
      ];
      const ACTIVITY_TIERS = ["Tier 1", "Tier 2", "Tier 3"];
      const STATUS_OPTIONS = ["Planned", "In progress", "Blocked", "Done"];

      // ── App state ────────────────────────────────────────────────────────────
      let viewStart = addDays(startOfWeek(new Date()), -30),
        filter = "all",
        categoryFilter = "all",
        tierFilter = "all",
        selectedId = null,
        drawerOpen = false,
        dragState = null,
        draftActivity = null,
        editingChannelId = null,
        editingOwnerIndex = null,
        openPaletteId = null,
        addChannelOpen = false,
        scrollExtendLock = false,
        suppressLaneCreate = false,
        scrollInitialised = false,
        undoStack = [],
        isSaving = false;

      let channels = [
        { id: "channel1", name: "SEO", color: "#7c3aed" },
        { id: "channel2", name: "PR", color: "#0ea5e9" },
        { id: "channel3", name: "Events", color: "#10b981" },
      ];
      let owners = ["Pierre", "Maya", "Alex", "Sam"];
      let campaigns = [];

      // ── Supabase helpers ─────────────────────────────────────────────────────

      function showStatus(msg, isError = false) {
        let el = document.getElementById("sync-status");
        if (!el) {
          el = document.createElement("div");
          el.id = "sync-status";
          el.style.cssText =
            "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:9999;transition:opacity 0.4s ease;pointer-events:none";
          document.body.appendChild(el);
        }
        el.textContent = msg;
        el.style.background = isError ? "#be123c" : "#172033";
        el.style.opacity = "1";
        clearTimeout(el._t);
        el._t = setTimeout(() => (el.style.opacity = "0"), 2200);
      }

      async function loadFromSupabase() {
        showStatus("Loading…");
        try {
          const [{ data: chRows }, { data: owRows }, { data: camRows }] =
            await Promise.all([
              sb.from("channels").select("*").order("id"),
              sb.from("owners").select("*").order("idx"),
              sb.from("campaigns").select("*"),
            ]);

          if (chRows && chRows.length) channels = chRows.map((r) => r.data).sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
          if (owRows && owRows.length) owners = owRows.map((r) => r.name);
          if (camRows && camRows.length)
            campaigns = ensureUniqueActivityIds(camRows.map((r) => r.data));

          // Seed defaults if DB is empty
          if (!chRows || !chRows.length) await saveChannels();
          if (!owRows || !owRows.length) await saveOwners();
          if (!camRows || !camRows.length) {
            campaigns = ensureUniqueActivityIds([
              {
                id: 1,
                title: "Example campaign",
                channel: channels[0].id,
                owner: owners[0] || "Pierre",
                status: "Planned",
                priority: "Tier 1",
                category: "Uncategorised",
                start: fmt(addDays(new Date(), 1)),
                end: fmt(addDays(new Date(), 8)),
                notes: "Drag this block to a different date or channel.",
                attachments: [],
              },
              {
                id: 2,
                title: "Example content sprint",
                channel: channels[1]?.id || channels[0].id,
                owner: owners[1] || owners[0],
                status: "In progress",
                priority: "Tier 2",
                category: "Coins",
                start: fmt(addDays(new Date(), 5)),
                end: fmt(addDays(new Date(), 18)),
                notes: "Add your own channels, team members and activities.",
                attachments: [],
              },
            ]);
            await saveCampaigns();
          }
          showStatus("Loaded ✓");
        } catch (err) {
          showStatus("Load failed — check console", true);
          console.error(err);
        }
        render();
        subscribeToChanges();
      }

      async function saveChannels() {
        // Embed the current array position in the data so order survives a DB round-trip
        const rows = channels.map((ch, i) => ({ id: ch.id, data: { ...ch, sort_order: i } }));
        await sb.from("channels").upsert(rows, { onConflict: "id" });
        // Remove deleted channels
        const ids = channels.map((c) => c.id);
        await sb.from("channels").delete().not("id", "in", `(${ids.map((i) => `"${i}"`).join(",")})`);
      }

      async function saveOwners() {
        const rows = owners.map((name, idx) => ({ idx, name }));
        await sb.from("owners").upsert(rows, { onConflict: "idx" });
        if (owners.length > 0) {
          await sb.from("owners").delete().gte("idx", owners.length);
        }
      }

      async function saveCampaigns() {
        campaigns = ensureUniqueActivityIds(campaigns);
        const rows = campaigns.map((c) => ({ id: c.id, data: c }));
        if (rows.length) {
          await sb.from("campaigns").upsert(rows, { onConflict: "id" });
        }
        // Remove deleted campaigns
        const ids = campaigns.map((c) => c.id);
        if (ids.length) {
          await sb
            .from("campaigns")
            .delete()
            .not("id", "in", `(${ids.join(",")})`);
        } else {
          await sb.from("campaigns").delete().neq("id", 0);
        }
      }

      async function saveAll() {
        if (isSaving) return;
        isSaving = true;
        showStatus("Saving…");
        try {
          await Promise.all([saveChannels(), saveOwners(), saveCampaigns()]);
          showStatus("Saved ✓");
        } catch (err) {

        sb.channel("realtime-changes")
          .on("postgres_changes", { event: "*", schema: "public", table: "campaigns" }, async () => {

            if (data) campaigns = ensureUniqueActivityIds(data.map((r) => r.data));
            render();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "channels" }, async () => {
            const { data } = await sb.from("channels").select("*");
            if (data && data.length) {
              channels = data.map((r) => r.data).sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
            }
            render();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "owners" }, async () => {
            const { data } = await sb.from("owners").select("*").order("idx");
            if (data && data.length) owners = data.map((r) => r.name);
            render();

          .subscribe();

      function ensureUniqueActivityIds(items) {

          let id = item.id;
          if (!id || seen.has(id)) {
            id = Date.now() + i + Math.floor(Math.random() * 100000);
          }
          seen.add(id);
          return { ...item, id };
        });
      }

      function snapshot() {

      async function undoLast() {
        const last = undoStack.pop();

          alert("Nothing to undo yet.");

        owners = s.owners;

      function esc(v) {

        );

              e = date(item.end);

          .filter((ch) => filter === "all" || ch.id === filter)

ft="category"' : 'data-edit="category"'}>${ACTIVITY_CATEGORIES.map((c) => `<option value="${c}" ${(selected.category || "Uncategorised") === c ? "selected" : ""}>${categoryIcon(c)} ${c}</option>`).join("")}</select></div>${isDraft ? `<div class="two"><div class="field"><label>Repeat</label><select data-draft="recurrence"><option ${selected.recurrence === "None" ? "selected" : ""}>None</option><option ${selected.recurrence === "Weekly" ? "selected" : ""}>Weekly</option><option ${selected.recurrence === "Monthly" ? "selected" : ""}>Monthly</option></select></div><div class="field"><label>Occurrences</label><input type="number" min="1" max="24" value="${selected.recurrenceCount || 1}" data-draft="recurrenceCount" /></div></div>` : ""}<div class="field"><label>Notes</label><textarea rows="5" ${isDraft ? 'data-draft="notes"' : 'data-edit="notes"'}>${esc(selected.notes)}</textarea></div><div class="field"><label>Attachments</label><input type="file" id="activityFiles" multiple /><div class="hint" style="margin-top:10px">${renderAttachments(selected)}<div style="font-size:12px;margin-top:8px;color:#70798b">Files are accessible in this browser session only. A live version needs backend storage for permanent access.</div></div></div>${isDraft ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-primary" id="saveDraftActivityButton">Create activity</button><button class="btn btn-secondary" id="cancelDraftActivityButton">Cancel</button></div>` : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-secondary" id="duplicateActivityButton">Duplicate activity</button><button class="btn btn-danger" id="deleteActivityButton">Delete activity</button></div>`}<div class="hint"><strong>Tip:</strong><br>Drag a block to move it. Drag the left or right edge to resize dates.</div>`;

        const created = [],
          batch = Date.now() + Math.floor(Math.random() * 100000);
        for (let i = 0; i < count; i++) {
          let offset = 0;
          if (repeats === "Weekly") offset = i * 7;
          if (repeats === "Monthly") offset = i * 30;
          created.push({
            ...base,
            id: batch + i,
            start: fmt(addDays(date(base.start), offset)),
            end: fmt(addDays(date(base.end), offset)),
            title: i === 0 ? base.title : `${base.title} ${i + 1}`,
          });
        }
        campaigns.push(...created);
        selectedId = created[0].id;
        draftActivity = null;
        drawerOpen = false;
        saveAll();
        render();
      }
      function cancelDraftActivity() {
        draftActivity = null;
        drawerOpen = false;
        render();
      }
      function deleteSelectedActivity() {
        snapshot();
        campaigns = campaigns.filter((i) => i.id !== selectedId);
        selectedId = null;
        drawerOpen = false;
        saveAll();
        render();
      }
      function duplicateSelectedActivity() {
        const item = campaigns.find((i) => i.id === selectedId);
        if (!item) return;
        snapshot();
        const copy = {
          ...item,
          id: Date.now() + Math.floor(Math.random() * 100000),
          title: `${item.title} copy`,
          start: fmt(addDays(date(item.start), 1)),
          end: fmt(addDays(date(item.end), 1)),
        };
        campaigns.push(copy);
        selectedId = copy.id;
        saveAll();
        render();
      }
      function addAttachments(list) {
        const files = Array.from(list || []).map((f) => ({
          name: f.name,
          size: f.size,
          type: f.type,
          url: URL.createObjectURL(f),
        }));
        if (!files.length) return;
        if (draftActivity) {
          draftActivity.attachments = [
            ...(draftActivity.attachments || []),
            ...files,
          ];
          render();
          return;
        }
        snapshot();
        campaigns = campaigns.map((i) =>
          i.id === selectedId
            ? { ...i, attachments: [...(i.attachments || []), ...files] }
            : i,
        );
        saveAll();
        render();
      }
      function removeAttachment(idx) {
        if (draftActivity) {
          draftActivity.attachments = (draftActivity.attachments || []).filter(
            (_, i) => i !== idx,
          );
          render();
          return;
        }
        snapshot();
        campaigns = campaigns.map((i) =>
          i.id === selectedId
            ? {
                ...i,
                attachments: (i.attachments || []).filter((_, j) => j !== idx),
              }
            : i,
        );
        saveAll();
        render();
      }
      // ── Drag ─────────────────────────────────────────────────────────────────
      // The dragged element moves with the cursor via CSS transform.
      // It snaps to DAY_WIDTH columns so you always see exactly where it'll land.
      // On drop a ✓ / ✕ confirm bar appears on the block — no save until confirmed.

      let pendingMove = null; // { id, newStart, newEnd, newChannel, el }

      function getWrap() { return document.querySelector(".timeline-wrap"); }

      function xToDay(clientX) {
        // Get any lane-grid to measure from — they all start at the same left edge
        const lane = document.querySelector(".lane-grid");
        if (!lane) return 0;
        const wrap = getWrap();
        const rect = lane.getBoundingClientRect();
        // clientX relative to lane + scroll = position within full timeline grid
        const xInGrid = clientX - rect.left + (wrap ? wrap.scrollLeft : 0);
        return Math.max(0, Math.min(VIEW_DAYS - 1, Math.floor(xInGrid / DAY_WIDTH)));
      }

      function channelAtY(clientY, clientX) {
        // Find which lane-grid the cursor's Y is inside
        const lanes = document.querySelectorAll(".lane-grid");
        for (const lane of lanes) {
          const r = lane.getBoundingClientRect();
          if (clientY >= r.top && clientY <= r.bottom) return lane.dataset.laneChannel;
        }
        return null;
      }

      function beginMove(e, el) {
        if (pendingMove) return; // don't start a new drag while confirm is showing
        const id = Number(el.dataset.taskId),
          item = campaigns.find((t) => t.id === id);
        if (!item) return;
        suppressLaneCreate = true;
        draftActivity = null;
        selectedId = id;

        const dur = Math.round((date(item.end) - date(item.start)) / DAY_MS) + 1;
        // How many days into the item did the user click? Keep that offset so
        // the block doesn't jump — the clicked day stays under the cursor.
        const clickDayOffset = xToDay(e.clientX) - Math.round((date(item.start) - viewStart) / DAY_MS);

        dragState = {
          mode: "move", id, el, item, dur,
          clickDayOffset: Math.max(0, Math.min(dur - 1, clickDayOffset)),
          startX: e.clientX, startY: e.clientY,
          hasMoved: false,
          originalStart: date(item.start),
          originalChannel: item.channel,
          // track current snapped position
          snappedDay: xToDay(e.clientX) - Math.max(0, Math.min(dur - 1, clickDayOffset)),
          snappedChannel: item.channel,
        };
        document.body.style.userSelect = "none";
        el.style.transition = "none";
        el.style.zIndex = "999";
        el.style.cursor = "grabbing";
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", endPointerAction);
      }

      function beginResize(e, handle) {
        const id = Number(handle.dataset.taskId),
          item = campaigns.find((t) => t.id === id);
        if (!item) return;
        dragState = {
          mode: "resize", side: handle.dataset.resize, id,
          startX: e.clientX,
          originalStart: date(item.start),
          originalEnd: date(item.end),
          snapshotted: false,
        };
        document.body.style.userSelect = "none";
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", endPointerAction);
      }

      function onPointerMove(e) {
        if (!dragState) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragState.hasMoved = true;

        if (dragState.mode === "move") {
          if (!dragState.hasMoved) return;
          dragState.el.style.boxShadow = "0 18px 42px rgba(20,24,38,0.28)";
          dragState.el.style.opacity = "0.92";

          // Snap to column grid
          const cursorDay = xToDay(e.clientX);
          const newStartDay = cursorDay - dragState.clickDayOffset;
          const snappedDay = Math.max(0, Math.min(VIEW_DAYS - dragState.dur, newStartDay));
          const snappedChannel = channelAtY(e.clientY, e.clientX) || dragState.snappedChannel;

          dragState.snappedDay = snappedDay;
          dragState.snappedChannel = snappedChannel;

          // Move the element visually — offset from its natural rendered position
          const naturalLeftPx = Math.round((date(dragState.item.start) - viewStart) / DAY_MS) * DAY_WIDTH;
          const targetLeftPx = snappedDay * DAY_WIDTH;
          const targetDx = targetLeftPx - naturalLeftPx;

          // Vertical: move to target lane
          const origLane = dragState.el.closest(".lane-grid");
          const targetLaneEl = document.querySelector(`.lane-grid[data-lane-channel="${snappedChannel}"]`);
          let targetDy = dy; // fallback to free-follow if lanes not found
          if (origLane && targetLaneEl) {
            const origRect = origLane.getBoundingClientRect();
            const targRect = targetLaneEl.getBoundingClientRect();
            targetDy = targRect.top - origRect.top;
          }

          dragState.el.style.transform = `translate(${targetDx}px, ${targetDy}px)`;

          // Highlight target lane
          document.querySelectorAll(".lane-grid").forEach(l => {
            l.style.background = l.dataset.laneChannel === snappedChannel
              ? `linear-gradient(${getChannel(snappedChannel).color}18, ${getChannel(snappedChannel).color}18), repeating-linear-gradient(to right,transparent 0,transparent 61px,var(--line) 61px,var(--line) 62px)`
              : "";
          });
          return;
        }

        // Resize — live, no saves during drag
        const deltaDays = Math.round(dx / DAY_WIDTH);
        if (!dragState.snapshotted) { snapshot(); dragState.snapshotted = true; }
        campaigns = campaigns.map((i) => {
          if (i.id !== dragState.id) return i;
          if (dragState.side === "left") {
            const ns = addDays(dragState.originalStart, deltaDays);
            return ns >= dragState.originalEnd ? i : { ...i, start: fmt(ns) };
          }
          const ne = addDays(dragState.originalEnd, deltaDays);
          return ne <= dragState.originalStart ? i : { ...i, end: fmt(ne) };
        });
        renderTimeline();
      }

      function endPointerAction() {
        document.body.style.userSelect = "";
        window.removeEventListener("mousemove", onPointerMove);
        window.removeEventListener("mouseup", endPointerAction);

        // Clear lane highlights
        document.querySelectorAll(".lane-grid").forEach(l => l.style.background = "");

        const wasClick = dragState && dragState.mode === "move" && !dragState.hasMoved;
        const moved    = dragState && dragState.mode === "move" && dragState.hasMoved;

        if (wasClick) {
          const id = dragState.id;
          dragState.el.style.transform = "";
          dragState.el.style.zIndex = "";
          dragState.el.style.cursor = "";
          dragState.el.style.boxShadow = "";
          dragState.el.style.opacity = "";
          dragState = null;
          suppressLaneCreate = false;
          selectTask(id);
          return;
        }

        if (moved) {
          const newStart = addDays(viewStart, dragState.snappedDay);
          const newEnd   = addDays(newStart, dragState.dur - 1);
          const newChannel = dragState.snappedChannel;

          // Check if anything actually changed
          const unchanged =
            fmt(newStart) === fmt(dragState.originalStart) &&
            newChannel === dragState.originalChannel;

          if (unchanged) {
            dragState.el.style.transform = "";
            dragState.el.style.zIndex = "";
            dragState.el.style.cursor = "";
            dragState.el.style.boxShadow = "";
            dragState.el.style.opacity = "";
            dragState = null;
            setTimeout(() => { suppressLaneCreate = false; }, 150);
            return;
          }

          // Store pending move, show confirm UI on the block
          pendingMove = { id: dragState.id, newStart, newEnd, newChannel };
          dragState.el.style.transform = "";
          dragState.el.style.cursor = "";
          dragState.el.style.boxShadow = "";
          dragState.el.style.opacity = "";

          // Move block to correct lane immediately for visual feedback, then show confirm
          snapshot();
          campaigns = campaigns.map(i =>
            i.id === pendingMove.id
              ? { ...i, channel: newChannel, start: fmt(newStart), end: fmt(newEnd) }
              : i
          );
          dragState = null;
          setTimeout(() => { suppressLaneCreate = false; }, 150);
          renderTimeline();
          showMoveConfirm(pendingMove.id);
          return;
        }

        if (dragState?.mode === "resize") {
          dragState = null;
          saveAll();
        } else {
          dragState = null;
        }
        setTimeout(() => { suppressLaneCreate = false; }, 0);
        render();
      }

      function showMoveConfirm(id) {
        // Find the rendered task block and inject ✓ / ✕ buttons
        const el = document.querySelector(`.task[data-task-id="${id}"]`);
        if (!el) return;
        el.style.zIndex = "999";
        el.style.outline = "3px solid #6366f1";

        const bar = document.createElement("div");
        bar.className = "move-confirm-bar";
        bar.style.cssText = `
          position:absolute;top:0;left:0;right:0;bottom:0;
          display:flex;align-items:center;justify-content:center;gap:8px;
          background:rgba(255,255,255,0.92);border-radius:12px;z-index:10;
        `;
        bar.innerHTML = `
          <button class="confirm-move-btn" style="background:#22c55e;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:900;font-size:13px;cursor:pointer">✓ Confirm</button>
          <button class="cancel-move-btn" style="background:#ef4444;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:900;font-size:13px;cursor:pointer">✕ Cancel</button>
        `;
        el.appendChild(bar);
      }

      function confirmMove() {
        pendingMove = null;
        document.querySelectorAll(".move-confirm-bar").forEach(b => b.remove());
        document.querySelectorAll(".task").forEach(t => { t.style.zIndex = ""; t.style.outline = ""; });
        saveAll();
        render();
      }

      function cancelMove() {
        if (!pendingMove) return;
        // Undo the optimistic move
        undoStack.pop(); // remove the snapshot we took
        const item = campaigns.find(i => i.id === pendingMove.id);
        // restore from the undo stack's last state
        const last = undoStack[undoStack.length - 1];
        if (last) {
          const prev = JSON.parse(last);
          campaigns = prev.campaigns;
        }
        pendingMove = null;
        document.querySelectorAll(".move-confirm-bar").forEach(b => b.remove());
        render();
      }
      document.addEventListener("click", (e) => {
        if (e.target.closest(".confirm-move-btn")) { confirmMove(); return; }
        if (e.target.closest(".cancel-move-btn"))  { cancelMove();  return; }
        const task = e.target.closest(".task");
        if (task && !e.target.closest(".resize-handle")) {
          if (suppressLaneCreate) {
            suppressLaneCreate = false;
            return;
          }
          selectTask(Number(task.dataset.taskId));
          return;
        }
        const laneClick = e.target.closest(".lane-grid");
        if (laneClick && !e.target.closest(".resize-handle")) {
          if (suppressLaneCreate) {
            suppressLaneCreate = false;
            return;
          }
          const rect = laneClick.getBoundingClientRect(),
            idx = Math.max(
              0,
              Math.min(
                VIEW_DAYS - 1,
                Math.floor((e.clientX - rect.left) / DAY_WIDTH),
              ),
            );
          addActivity(addDays(viewStart, idx), laneClick.dataset.laneChannel);
          return;
        }
        const colour = e.target.closest("[data-channel-color]");
        if (colour) {
          e.preventDefault();
          e.stopPropagation();
          changeChannelColor(
            colour.dataset.channelColor,
            colour.dataset.colourValue,
          );
          return;
        }
        if (!e.target.closest(".colour-wrap")) openPaletteId = null;
        const fb = e.target.closest("[data-filter]");
        if (fb) setFilter(fb.dataset.filter);
        if (e.target.id === "saveDatesButton") {
          const start = document.getElementById("startInput");
          const end = document.getElementById("endInput");
          if (start && end) {
            if (end.value < start.value) { alert("End date cannot be before start date."); return; }
            snapshot();
            campaigns = campaigns.map((i) =>
              i.id === selectedId ? { ...i, start: start.value, end: end.value } : i,
            );
            saveAll();
            render();
          }
          return;
        }
        if (e.target.id === "saveTitleButton") {
          const input = document.getElementById("titleInput");
          if (input) {
            clearTimeout(saveDebounceTimer);
            updateSelected("title", input.value, true);
          }
          return;
        }
        if (e.target.id === "closeDrawerButton") {
          drawerOpen = false;
          render();
        }
        if (e.target.id === "deleteActivityButton") deleteSelectedActivity();
        if (e.target.id === "duplicateActivityButton")
          duplicateSelectedActivity();
        if (e.target.id === "saveDraftActivityButton") saveDraftActivity();
        if (e.target.id === "cancelDraftActivityButton") cancelDraftActivity();
        const remove = e.target.closest("[data-remove-file]");
        if (remove) removeAttachment(Number(remove.dataset.removeFile));
      });
      document.addEventListener("input", (e) => {
        const edit = e.target.closest("[data-edit]");
        if (edit && edit.tagName !== "SELECT") {
          const field = edit.dataset.edit;
          if (field === "title") return; // handled by Save title button
          if (field === "start" || field === "end") return; // handled by Save dates button
          updateSelected(field, edit.value, false); // notes — debounced, no re-render mid-type
        }
        const draft = e.target.closest("[data-draft]");
        if (draft && draft.tagName !== "SELECT") updateDraftActivity(draft.dataset.draft, draft.value);
      });
      document.addEventListener(
        "blur",
        (e) => {
          const edit = e.target.closest("[data-edit]");
          if (edit && edit.dataset.edit === "notes") {
            clearTimeout(saveDebounceTimer);
            saveAll();
            render();
          }
        },
        true,
      );
      document.addEventListener("change", (e) => {
        if (e.target.id === "activityFiles") { addAttachments(e.target.files); return; }
        const edit = e.target.closest("[data-edit]");
        if (edit && edit.tagName === "SELECT") {
          updateSelected(edit.dataset.edit, edit.value, true);
          return;
        }
        const draft = e.target.closest("[data-draft]");
        if (draft && draft.tagName === "SELECT") updateDraftActivity(draft.dataset.draft, draft.value);
      });
      document.addEventListener("mousedown", (e) => {
        const handle = e.target.closest(".resize-handle");
        if (handle) {
          e.preventDefault();
          e.stopPropagation();
          beginResize(e, handle);
          return;
        }
        const task = e.target.closest(".task");
        if (task) beginMove(e, task);
      });
      document
        .getElementById("toggleAddChannel")
        .addEventListener("click", () => {
          addChannelOpen = !addChannelOpen;
          render();
        });
      document
        .getElementById("addChannelButton")
        .addEventListener("click", addChannel);
      document
        .getElementById("newChannelName")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") addChannel();
        });
      document
        .getElementById("showAllChannels")
        .addEventListener("click", () => setFilter("all"));
      document
        .getElementById("addOwnerButton")
        .addEventListener("click", addOwner);
      document
        .getElementById("newOwnerName")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") addOwner();
        });
      document.getElementById("search").addEventListener("input", render);
      document
        .getElementById("categoryFilter")
        .addEventListener("change", (e) => {
          categoryFilter = e.target.value;
          render();
        });
      document.getElementById("tierFilter").addEventListener("change", (e) => {
        tierFilter = e.target.value;
        render();
      });
      document.getElementById("undoButton").addEventListener("click", () => undoLast());
      document.getElementById("prev").addEventListener("click", () => {
        viewStart = addDays(viewStart, -7);
        scrollInitialised = false;
        render();
      });
      document.getElementById("next").addEventListener("click", () => {
        viewStart = addDays(viewStart, 7);
        scrollInitialised = false;
        render();
      });
      document.getElementById("today").addEventListener("click", () => {
        viewStart = addDays(startOfWeek(new Date()), -30);
        scrollInitialised = false;
        render();
      });
      document.getElementById("toggleDrawer").addEventListener("click", () => {
        drawerOpen = !drawerOpen;
        render();
      });
      document.getElementById("addActivity").addEventListener("click", (e) => {
        e.preventDefault();
        addActivity();
      });
      // Boot — load from Supabase instead of localStorage
      loadFromSupabase();
    </script>
  </body>
</html>
